<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EMPS - Login do Paciente</title>

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* CORES */
        :root {
            --cor-principal: #6123b6;
            --cor-principal-hover: #541ca6;
            --cor-clara: #f4eef9;
            --cor-icone: #6d35b8;
            --cor-foco: #7132c3;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #1f163d;
            min-height: 100vh;
            transition: color 0.5s ease;
        }

        /* PÁGINA */
        .pagina {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 5%;
            transition: background 0.5s ease;
        }

        /* CONTAINER */
        .container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 430px 430px;
            align-items: center;
            justify-content: center;
            gap: 70px;
        }

        /* LOGIN */
        .login-area {
            width: 100%;
            max-width: 430px;
        }

        /* LOGO */
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 27px;
            font-weight: 800;
            color: var(--cor-principal);
            transition: color 0.5s ease;
        }

        .logo-icon {
            width: 32px;
            height: 28px;
            background: var(--cor-principal);
            clip-path: polygon(
                50% 0%,
                63% 10%,
                75% 27%,
                87% 20%,
                100% 33%,
                95% 52%,
                75% 70%,
                50% 100%,
                25% 70%,
                5% 52%,
                0% 33%,
                13% 20%,
                25% 27%,
                37% 10%
            );
            transition: background 0.5s ease;
        }

        /* TÍTULO */
        .titulo {
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            color: #26194a;
            margin-bottom: 6px;
            transition: color 0.5s ease;
        }

        .subtitulo {
            text-align: center;
            color: #7e778d;
            font-size: 12px;
            margin-bottom: 22px;
        }

        /* CAMPOS */
        .campo {
            margin-bottom: 14px;
        }

        .campo label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #3b3452;
        }

        .input-box {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--cor-icone);
            font-size: 13px;
            z-index: 2;
            transition: color 0.5s ease;
        }

        .input-box input {
            width: 100%;
            height: 42px;
            padding: 0 40px;
            border: 1px solid #ded8e8;
            border-radius: 6px;
            background: #faf9fd;
            outline: none;
            color: #312b3d;
            font-size: 12px;
            transition:
                border-color 0.3s ease,
                background 0.5s ease,
                box-shadow 0.3s ease;
        }

        .input-box input::placeholder {
            color: #a7a1af;
        }

        .input-box input:focus {
            border-color: var(--cor-foco);
            box-shadow: 0 0 0 2px rgba(97, 35, 182, 0.08);
        }

        /* ERRO / SUCESSO */
        .input-box.erro input {
            border-color: #d93025;
            background: #fff8f8;
            box-shadow: 0 0 0 2px rgba(217, 48, 37, 0.06);
        }

        .input-box.sucesso input {
            border-color: #36a269;
            background: #f7fffa;
        }

        /* SENHA */
        .mostrar-senha {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #777080;
            font-size: 14px;
        }

        .mostrar-senha i {
            font-size: 13px;
        }

        /* OPÇÕES */
        .opcoes {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            font-size: 11px;
        }

        .lembrar {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #7a7482;
        }

        .lembrar input {
            accent-color: var(--cor-principal);
        }

        .esqueci {
            color: var(--cor-principal);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.5s ease;
        }

        .esqueci:hover {
            text-decoration: underline;
        }

        /* BOTÃO ENTRAR */
        .btn-entrar {
            width: 100%;
            border: none;
            padding: 12px;
            border-radius: 6px;
            background: var(--cor-principal);
            color: white;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition:
                background 0.5s ease,
                transform 0.2s ease;
        }

        .btn-entrar:hover {
            background: var(--cor-principal-hover);
            transform: translateY(-1px);
        }

        .btn-entrar:disabled {
            opacity: 0.7;
            cursor: wait;
            transform: none;
        }

        /* MENSAGEM */
        .mensagem-erro {
            display: none;
            margin-top: 12px;
            padding: 10px;
            border-radius: 6px;
            background: #fff1f1;
            border: 1px solid #f1bcbc;
            color: #c62828;
            font-size: 11px;
            text-align: center;
        }

        .mensagem-erro.mostrar {
            display: block;
        }

        /* DIVISOR */
        .divisor {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 16px 0;
            color: #9a94a3;
            font-size: 11px;
        }

        .divisor::before,
        .divisor::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e5e1e9;
        }

        /* GOOGLE */
        .btn-google {
            width: 100%;
            height: 42px;
            background: #ffffff;
            border: 1px solid #ddd8e5;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: #554e5e;
        }

        .btn-google:hover {
            background: #faf8fc;
        }

        .google-icon {
            font-weight: 900;
            font-size: 16px;
            color: #4285f4;
        }

        /* CADASTRO */
        .cadastro {
            text-align: center;
            margin-top: 15px;
            color: #827b8b;
            font-size: 11px;
        }

        .cadastro a {
            color: var(--cor-principal);
            font-weight: 700;
            text-decoration: none;
            transition: color 0.5s ease;
        }

        .cadastro a:hover {
            text-decoration: underline;
        }

        /* MASCOTE */
        .mascote-area {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mascote-area img {
            width: 390px;
            max-width: 100%;
            object-fit: contain;
            filter: none;
            box-shadow: none;
        }

        /* RESPONSIVO */
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
                max-width: 500px;
                gap: 35px;
            }

            .login-area {
                margin: 0 auto;
            }

            .mascote-area {
                order: -1;
            }

            .mascote-area img {
                width: 280px;
            }
        }

        @media (max-width: 520px) {
            .pagina {
                padding: 20px;
            }

            .login-area {
                max-width: 100%;
            }

            .logo {
                font-size: 24px;
            }

            .titulo {
                font-size: 20px;
            }

            .subtitulo {
                font-size: 11px;
            }

            .mascote-area img {
                width: 230px;
            }
        }
    </style>
</head>

<body>
    <div class="pagina">
        <div class="container">

            <!-- FORMULÁRIO -->
            <div class="login-area">

                <!-- LOGO -->
                <div class="logo">
                    <div class="logo-icon"></div>
                    EMPS
                </div>

                <h1 class="titulo">BEM-VINDO DE VOLTA!</h1>

                <p class="subtitulo">
                    Seu cuidado continua aqui. Entre na sua conta!
                </p>

                <!-- EMAIL -->
                <div class="campo">
                    <label for="email">E-mail</label>

                    <div class="input-box">
                        <span class="input-icon">
                            <i class="fa-solid fa-envelope"></i>
                        </span>

                        <input
                            type="email"
                            id="email"
                            placeholder="Digite seu e-mail"
                            autocomplete="username"
                        >
                    </div>
                </div>

                <!-- SENHA -->
                <div class="campo">
                    <label for="senha">Senha</label>

                    <div class="input-box">
                        <span class="input-icon">
                            <i class="fa-solid fa-lock"></i>
                        </span>

                        <input
                            type="password"
                            placeholder="Digite sua senha"
                            id="senha"
                            autocomplete="current-password"
                        >

                        <span
                            class="mostrar-senha"
                            onclick="mostrarSenha()"
                            role="button"
                            aria-label="Mostrar ou ocultar senha"
                        >
                            <i id="iconeSenha" class="fa-solid fa-eye"></i>
                        </span>
                    </div>
                </div>

                <!-- OPÇÕES -->
                <div class="opcoes">
                    <label class="lembrar">
                        <input type="checkbox" id="lembrar">
                        Lembrar de mim
                    </label>

                    <a href="#" class="esqueci"
                        onclick="return false;">
                        Esqueci minha senha
                    </a>
                </div>

                <!-- ENTRAR -->
                <button
                    type="button"
                    class="btn-entrar"
                    id="btnEntrar"
                    onclick="entrar()"
                >
                    Entrar
                </button>

                <!-- MENSAGEM -->
                <p
                    id="mensagemErro"
                    class="mensagem-erro"
                    role="alert"
                    aria-live="polite"
                ></p>

                <!-- DIVISOR -->
                <div class="divisor">ou</div>

                <!-- GOOGLE -->
                <button type="button" class="btn-google"
                    onclick="mostrarErro('O login com Google ainda não está disponível.')">
                    <span class="google-icon">G</span>
                    Entrar com Google
                </button>

                <!-- CADASTRO -->
                <p class="cadastro">
                    Ainda não tem uma conta?
                    <a href="cadastro.html">Cadastre-se</a>
                </p>
            </div>

            <!-- MASCOTE -->
            <div class="mascote-area">
                <img
                    src="img/mascote.jpeg"
                    alt="Mascote EMPS"
                >
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>

    <script>
        /* LOGIN DO PACIENTE */

        async function entrar() {
            const mensagem = document.getElementById("mensagemErro");
            const email = document.getElementById("email");
            const senha = document.getElementById("senha");
            const botao = document.getElementById("btnEntrar");

            const valorEmail = email.value.trim();
            const valorSenha = senha.value;

            mensagem.innerText = "";
            mensagem.classList.remove("mostrar");

            document.querySelectorAll(".input-box").forEach(box => {
                box.classList.remove("erro", "sucesso");
            });

            if (!valorEmail || !valorSenha.trim()) {
                mostrarErro("Preencha todos os campos antes de entrar.");
                marcarCamposVazios();
                return;
            }

            const emailValido = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailValido.test(valorEmail)) {
                mostrarErro("Digite um e-mail válido.");
                email.parentElement.classList.add("erro");
                email.focus();
                return;
            }

            if (typeof API === "undefined" || !API) {
                mostrarErro("A configuração da API não foi encontrada.");
                console.error("Verifique o arquivo js/api.js e a variável API.");
                return;
            }

            const dados = new URLSearchParams();
            dados.append("username", valorEmail);
            dados.append("password", valorSenha);

            botao.disabled = true;
            botao.innerText = "Verificando...";

            try {
                /* 1. AUTENTICA AS CREDENCIAIS NA API */

                const resposta = await fetch(`${API}/login/`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: dados
                });

                if (!resposta.ok) {
                    if (resposta.status === 400 || resposta.status === 401) {
                        mostrarErro("E-mail ou senha inválidos.");
                        email.parentElement.classList.add("erro");
                        senha.parentElement.classList.add("erro");
                    } else {
                        mostrarErro(
                            `Erro ao entrar. Código do servidor: ${resposta.status}`
                        );
                    }

                    return;
                }

                const dadosLogin = await resposta.json();
                const token = dadosLogin?.access_token;

                if (!token) {
                    mostrarErro("A API não retornou um token de acesso.");
                    console.error("Resposta recebida no login:", dadosLogin);
                    return;
                }

                /* 2. CONSULTA O USUÁRIO AUTENTICADO */

                const respostaUsuario = await fetch(`${API}/usuarios/me`, {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Accept": "application/json"
                    }
                });

                if (!respostaUsuario.ok) {
                    mostrarErro(
                        "Não foi possível confirmar os dados da sua conta."
                    );

                    console.error(
                        "Falha ao consultar /usuarios/me:",
                        respostaUsuario.status
                    );

                    return;
                }

                const usuario = await respostaUsuario.json();

                console.log("Usuário autenticado:", usuario);

                /* 3. PERMITE SOMENTE CONTAS DE PACIENTES */

                const tipoUsuario = String(usuario.tipo || "").toLowerCase();

                if (tipoUsuario !== "paciente") {
                    mostrarErro(
                        "Esta área é exclusiva para pacientes. Entre pela página correspondente à sua conta."
                    );

                    email.parentElement.classList.add("erro");
                    senha.parentElement.classList.add("erro");
                    return;
                }

                /* 4. SALVA A SESSÃO DO PACIENTE */

                localStorage.setItem("token", token);
                localStorage.setItem("usuario", JSON.stringify(usuario));

                marcarCamposSucesso();

                /* 5. REDIRECIONA PARA A INTERFACE DO PACIENTE */

                window.location.href = "InterfacePac.html";

            } catch (erro) {
                console.error("Erro ao realizar login:", erro);

                mostrarErro(
                    "Não foi possível conectar ao servidor. Verifique sua conexão e tente novamente."
                );

            } finally {
                botao.disabled = false;
                botao.innerText = "Entrar";
            }
        }

        /* MENSAGEM DE ERRO */

        function mostrarErro(texto) {
            const mensagem = document.getElementById("mensagemErro");
            mensagem.innerText = texto;
            mensagem.classList.add("mostrar");
        }

        /* CAMPOS VAZIOS */

        function marcarCamposVazios() {
            document.querySelectorAll(".input-box input").forEach(campo => {
                if (!campo.value.trim()) {
                    campo.parentElement.classList.add("erro");
                }
            });
        }

        /* CAMPOS CORRETOS */

        function marcarCamposSucesso() {
            document.querySelectorAll(".input-box input").forEach(campo => {
                if (campo.value.trim()) {
                    campo.parentElement.classList.add("sucesso");
                }
            });
        }

        /* MOSTRAR / OCULTAR SENHA */

        function mostrarSenha() {
            const senha = document.getElementById("senha");
            const iconeSenha = document.getElementById("iconeSenha");

            if (senha.type === "password") {
                senha.type = "text";
                iconeSenha.className = "fa-solid fa-eye-slash";
            } else {
                senha.type = "password";
                iconeSenha.className = "fa-solid fa-eye";
            }
        }

        /* PERMITE ENTRAR PRESSIONANDO ENTER */

        document.getElementById("senha").addEventListener("keydown", event => {
            if (event.key === "Enter") {
                entrar();
            }
        });

        document.getElementById("email").addEventListener("keydown", event => {
            if (event.key === "Enter") {
                entrar();
            }
        });
    </script>
</body>

</html>
